<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
    }
    img {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="image.png" alt="Photograph">
</body>
</html>
